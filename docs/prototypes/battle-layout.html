<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>战斗空间验证 · 最后的分子</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#17191c;color:#e4e6e9;font:14px system-ui,sans-serif}main{max-width:1500px;margin:auto;padding:22px}h1{font-size:22px;margin:0 0 8px}p{color:#aeb5be;margin:8px 0 18px;line-height:1.6}.tools{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-bottom:18px}label{display:flex;gap:8px;align-items:center}button,select{background:#30353b;color:#eee;border:1px solid #68717b;border-radius:3px;padding:7px 11px}button.active{background:#666f79}.stage{position:relative;width:100%;overflow:hidden;background:#24282d;border:1px solid #707983;aspect-ratio:16/9}.stage:focus{outline:2px solid white}#world{position:absolute;inset:8% 0 29%;background:linear-gradient(#30363c,#383f45)}.plane{position:absolute;left:-8%;right:-8%;top:47%;height:24%;background:#454b51;transform:perspective(500px) rotateX(25deg);border-top:1px solid #69727b}.hud{position:absolute;inset:0 0 auto;height:8%;background:#161a1e;display:flex;align-items:center;justify-content:space-between;padding:0 3%;font-size:clamp(9px,1.4vw,20px)}.guide{position:absolute;border:1px dashed #a4adb7;pointer-events:none;color:#bbc2ca;font-size:12px}.guide span{background:#24282d;padding:2px 5px}.g1{inset:8% 0 29%}.g2{inset:71% 15% 0}.g3{left:39%;top:18%;width:20%;height:36%}.hidden{display:none!important}.shadow{position:absolute;border-radius:50%;background:#12151980;height:3%;transform:translate(-50%,-50%)}.actor{position:absolute;transform:translate(-50%,-100%);border:3px solid #aeb7bf;display:flex;align-items:center;justify-content:center;color:#e6e9ec;text-align:center;font-size:clamp(10px,1.4vw,19px)}.molecule{border:0;background:transparent}.molecule svg{width:100%;height:100%;overflow:visible}.enemy{border-radius:42% 30% 28% 32%;background:#59626b}.enemy:after{content:'';position:absolute;width:40%;height:45%;left:16%;top:25%;background:#292e33;border:2px solid #9da6af;border-radius:40% 15% 40% 20%}.enemy span{z-index:1;align-self:flex-end;padding-bottom:8%}.intent{position:absolute;transform:translate(-50%,-100%);background:#191e23;padding:4px 9px;font-size:clamp(9px,1.3vw,17px)}.meta{position:absolute;transform:translateX(-50%);text-align:center;font-size:clamp(8px,1.15vw,16px)}.bar{height:8px;background:#77838d;border:1px solid #d0d5d9;margin:4px 0}.statuses{font-size:.8em;color:#c3c8cd}.dock{position:absolute;inset:71% 0 0;background:#191d22c9;border-top:1px solid #68717b}.card{position:absolute;width:10.1%;height:25%;background:#b9bec3;color:#191d21;border:2px solid #eceff2;transform-origin:50% 100%;border-radius:3px;text-align:center;transition:left .16s,top .16s,transform .16s;cursor:pointer;z-index:3;box-shadow:0 4px 6px #0008;font-size:clamp(8px,1.1vw,15px)}.card strong{display:block;padding:7% 3%;border-bottom:1px solid #626c75}.card .art{height:35%;margin:5%;background:#87919b;display:grid;place-items:center}.card small{display:block;margin-top:9%}.card.selected{outline:3px solid white;z-index:20}.energy,.end,.pile{position:absolute;background:#30363d;border:1px solid #b0b8c0;border-radius:4px;text-align:center;padding:1%;z-index:5;font-size:clamp(9px,1.4vw,18px)}.energy{left:3%;top:75%;width:10%;height:11%}.energy b{display:block}.end{right:3%;top:77%;width:12%;height:9%;cursor:pointer}.pile{bottom:3%;width:10%;font-size:clamp(8px,1.1vw,15px)}.draw{left:3%}.discard{right:3%}.impact{position:absolute;width:10%;aspect-ratio:1;transform:translate(-50%,-50%);background:#d0d6dcaa;clip-path:polygon(50% 0,60% 34%,96% 15%,72% 45%,100% 62%,68% 65%,70% 100%,49% 73%,13% 95%,30% 62%,0 40%,40% 37%);z-index:2;pointer-events:none}.note{position:absolute;left:3%;top:10%;font-size:clamp(8px,1.1vw,15px);color:#d1d6db}.legend{font-size:13px;margin-top:14px;color:#bfc6ce;line-height:1.8}
</style><main><h1>战斗空间灰盒 · 待审核</h1><p>只验证构图、锚点和交互范围。色块不代表最终美术。悬停卡牌检查抬升；切换目标数量、手牌数量与窗口比例检查拥挤和遮挡。</p>
<div class="tools"><label>目标 <select id="targets"><option>1</option><option>2</option><option>3</option></select></label><label>手牌 <input id="cards" type="range" min="0" max="10" value="5"><output id="count">5</output></label><label>画幅 <select id="ratio"><option value="16/9">16:9</option><option value="16/10">16:10</option><option value="4/3">4:3（压力测试）</option></select></label><label><input type="checkbox" id="guides" checked>空间边界</label><label><input type="checkbox" id="complex">大分子结构</label><button id="action">检查命中姿态</button></div>
<div class="stage" id="stage"><div id="world"></div><div class="plane"></div><div class="hud"><span>LM-001 · 发现阶段</span><span>回合 6 · AI ×1.0　Ⅱ</span></div><div class="note">本回合还可安全攻击 2 次</div><div class="dock"></div><div id="actors"></div><div id="hand"></div><div class="energy">能量<b>3 / 3</b></div><button class="end">结束回合 E</button><div class="pile draw">抽牌堆 12</div><div class="pile discard">弃牌堆 5</div><div class="guide g1"><span>战场：站位、接触阴影与动作</span></div><div class="guide g2"><span>操作层：动态手牌</span></div><div class="guide g3"><span>动作通道</span></div></div>
<div class="legend">固定语义：结构中心、作用端点、承托投影、状态锚点分别定义。命中姿态只改变战场层，血条与手牌保持稳定。此页不是新美术稿，也不是已完成的 Godot 重构。</div></main>
<script>
const $=id=>document.getElementById(id);let hit=false,hover=-1;function node(cls,x,y,w,h,html=''){let d=document.createElement('div');d.className=cls;d.style.left=x+'%';d.style.top=y+'%';if(w)d.style.width=w+'%';if(h)d.style.height=h+'%';d.innerHTML=html;return d}function render(){let n=+$('targets').value,k=+$('cards').value;$('count').value=k;$('stage').style.aspectRatio=$('ratio').value;$('actors').replaceChildren();$('hand').replaceChildren();document.querySelectorAll('.guide').forEach(e=>e.classList.toggle('hidden',!$('guides').checked));let x=hit?48:26,y=hit?52:56;let a=node('actor molecule',x,y,$('complex').checked?31:25,29,`<svg viewBox="0 0 300 200"><g fill="none" stroke="#c4ccd3" stroke-width="12" stroke-linejoin="round"><path d="M110 70L150 47L190 70V115L150 139L110 115Z"/><path d="M110 70L60 35M190 70L240 35L272 50M110 115L63 142L28 130M190 115L234 144M150 47V15"/>${$('complex').checked?'<path d="M63 142L65 180L30 195L0 173V140L28 130M234 144L269 160L294 142V108L260 94L234 110Z"/>':''}</g></svg>`);$('actors').append(node('shadow',26,58,22,3),a,node('meta',26,61,22,0,'LM-001<div class="bar"></div><div class="statuses">77 / 100　◇ 8　叶 2</div>'));let positions=n===1?[75]:n===2?[66,85]:[60,75,90];positions.forEach((p,i)=>{$('actors').append(node('shadow',p,58,n===1?30:15,3),node('actor enemy',p,58,n===1?34:17,n===1?45:29,'<span>目标 '+(i+1)+'</span>'),node('intent',p,n===1?12:28,0,0,'⚔ 12'),node('meta',p,61,n===1?25:15,0,'结合口袋<div class="bar"></div><div class="statuses">46 / 80　状态 2</div>'))});if(hit)$('actors').append(node('impact',positions[0]-10,43,12,0));let spacing=Math.min(10.4,62/Math.max(1,k-1));for(let i=0;i<k;i++){let d=i-(k-1)/2;let c=node('card'+(hover===i?' selected':''),50+d*spacing-5.05,hover===i?65:72+Math.abs(d)*.5,0,0,`<strong>${['攻击','防御','技能','实验','AI'][i%5]} ${i+1}</strong><div class="art">插画区域</div><small>图标 ＋ 数值</small>`);c.style.transform=`rotate(${hover===i?0:d*3}deg) scale(${hover===i?1.12:1})`;c.onmouseenter=()=>{c.classList.add("selected");c.style.top="65%";c.style.transform="rotate(0deg) scale(1.12)"};c.onmouseleave=()=>{c.classList.remove("selected");c.style.top=(72+Math.abs(d)*.5)+"%";c.style.transform=`rotate(${d*3}deg)`};$('hand').append(c)}}
for(let id of ['targets','cards','ratio','guides','complex'])$(id).oninput=()=>{hover=-1;render()};$('action').onclick=()=>{hit=!hit;$('action').textContent=hit?'返回常态站位':'检查命中姿态';render()};render();
</script></html>
